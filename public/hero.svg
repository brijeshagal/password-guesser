<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E2E8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background elements -->
  <circle cx="150" cy="150" r="80" fill="#0052f" opacity="0.1"/>
  <circle cx="1050" cy="200" r="60" fill="#7C3AED" opacity="0.1"/>
  <circle cx="200" cy="500" r="40" fill="#3B82F6" opacity="0.1"/>
  
  <!-- Game interface mockup -->
  <rect x="200" y="100" width="800" height="430" rx="20" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="200" y="100" width="800" height="80" rx="20" fill="url(#headerGradient)"/>
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <text x="600" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Guess the Password</text>
  
  <!-- Input field -->
  <rect x="250" y="220" width="700" height="60" rx="12" fill="#F8FAFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="270" y="260" fill="#475569" font-family="Arial, sans-serif" font-size="18">Enter your password...</text>
  
  <!-- Rule cards -->
  <rect x="250" y="300" width="340" height="80" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
  <text x="270" y="330" fill="#065F46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓ Must be at least 8 characters</text>
  <text x="270" y="350" fill="#065F46" font-family="Arial, sans-serif" font-size="12">Rule completed</text>
  
  <rect x="610" y="300" width="340" height="80" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
  <text x="630" y="330" fill="#991B1B" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✗ Must contain a number</text>
  <text x="630" y="350" fill="#991B1B" font-family="Arial, sans-serif" font-size="12">Current rule</text>
  
  <!-- Progress bar -->
  <rect x="250" y="400" width="700" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="250" y="400" width="140" height="20" rx="10" fill="#059669"/>
  <text x="600" y="440" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">1 of 5 rules completed</text>
  
  <!-- Lock icons -->
  <g transform="translate(250, 470)">
    <circle cx="20" cy="20" r="15" fill="#0052f"/>
    <path d="M20 10V20" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 20L28 28" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(300, 470)">
    <circle cx="20" cy="20" r="15" fill="#7C3AED"/>
    <path d="M20 10V20" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 20L28 28" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(350, 470)">
    <circle cx="20" cy="20" r="15" fill="#3B82F6"/>
    <path d="M20 10V20" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 20L28 28" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(400, 470)">
    <circle cx="20" cy="20" r="15" fill="#E2E8F0"/>
    <path d="M20 10V20" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 20L28 28" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(450, 470)">
    <circle cx="20" cy="20" r="15" fill="#E2E8F0"/>
    <path d="M20 10V20" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 20L28 28" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Tagline -->
  <text x="600" y="580" text-anchor="middle" fill="#0052f" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Crack the password rules!</text>
</svg> 